name: Security & Unit Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run command security tests (Linux host with unconditional symlink coverage)
        run: ./gradlew :tools:local:test --info

      - name: Run core network and agent runtime unit tests
        run: ./gradlew :core:network:testDebugUnitTest --info

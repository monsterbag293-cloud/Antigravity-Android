name: Security & Unit Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run command security tests (tools:local)
        run: |
          # Try the standard JVM test task first, then the Android unit-test task.
          # If neither exists, skip without failing the workflow.
          ./gradlew :tools:local:test --info || \
          ./gradlew :tools:local:testDebugUnitTest --info || \
          echo "No unit test task found for :tools:local — skipping"

      - name: Run core network and agent runtime unit tests
        run: ./gradlew :core:network:testDebugUnitTest --info
